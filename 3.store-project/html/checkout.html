<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../images/icons/flory-fav-icon.png">
    <link rel="stylesheet" href="../style/generale.css">

    <link rel="stylesheet" href="../style/pages/checkout.css">
    <link rel="stylesheet" href="../style/components/footer.css">
    <title>Checkout</title>
</head>

<body>
    <header class="checkout-header">
        <div class="checkout-header-inner">
            <a class="checkout-logo" href="./index.html">
                <img src="../images/flory-logo-background-removed.png" alt="FLORY home">
            </a>

            <h1 class="checkout-title">
                Checkout
                <span class="checkout-item-count js-checkout-item-count">(0 items)</span>
            </h1>

            <span class="checkout-lock" aria-hidden="true">&#128274;&#65038;</span>
        </div>
    </header>


    <main class="checkout-main">
        <h2 class="checkout-section-title" id="review-heading">
            Review your order
        </h2>

        <div class="checkout-layout">
            <section class="checkout-items js-checkout-items" aria-labelledby="review-heading"></section>

            <aside class="order-summary" aria-labelledby="order-summary-heading">
                <h2 class="order-summary-title" id="order-summary-heading">Order summary</h2>

                <dl class="order-summary-details">
                    <div class="order-summary-row">
                        <dt>Items (<span class="js-summary-item-count">3</span>)</dt>
                        <dd class="js-summary-subtotal">€47.70</dd>
                    </div>

                    <div class="order-summary-row">
                        <dt>Shipping</dt>
                        <dd class="js-summary-shipping">€0.00</dd>
                    </div>

                    <div class="order-summary-row order-summary-total">
                        <dt>Order total</dt>
                        <dd class="js-summary-total">€47.70</dd>
                    </div>
                </dl>

                <button type="button" class="place-order-button js-place-order">
                    Place your order
                </button>
            </aside>
        </div>
    </main>
    <footer class="flory-footer">
        <div class="flory-footer-inner">
            <a class="flory-footer-brand" href="index.html" aria-label="FLORY home">
                <img src="../images/flory-logo-background-removed.png" alt="FLORY">
            </a>

            <nav class="flory-footer-nav" aria-label="Footer navigation">
                <ul class="flory-footer-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#shop">Shop</a></li>
                    <li><a href="index.html#collection">Collection</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="orders.html">Orders &amp; Returns</a></li>
                </ul>
            </nav>

            <p class="flory-footer-credit">
                Developed by
                <a href="https://github.com/Elmahdi25">https://github.com/Elmahdi25</a>
            </p>
        </div>
    </footer>
    <script type="module" src="../script/checkout.js"></script>
</body>

</html>
