<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./images/icons/flory-fav-icon.png">
    <title>FLORY</title>
    <link rel="stylesheet" href="./style/index/header.css">
    <link rel="stylesheet" href="./style/index/main.css">
    <link rel="stylesheet" href="./style/index/footer.css">
</head>

<body>
    <header class="store-header">
        <div class="header-inner">
            <a class="brand" href="index.html">
                <img src="images/flory-logo.png" alt="FLORY home">
            </a>

            <form class="store-search" role="search" action="search.html" method="get">
                <input type="search" name="q" aria-label="Search for hijabs and scarves"
                    placeholder="Search for hijabs, scarves..." required>
                <button type="submit" aria-label="Search">
                    <span class="search-icon" aria-hidden="true"></span>
                </button>
            </form>

            <nav class="header-actions" aria-label="Store links">
                <a class="orders-link" href="orders.html">Orders &amp; Returns</a>

                <div class="cart-tools">
                    <a class="icon-link" href="cart.html" aria-label="Shopping bag, 0 items">
                        <span class="bag-icon" aria-hidden="true"></span>
                        <span class="bag-count" aria-hidden="true">0</span>
                    </a>
                </div>
            </nav>
        </div>
    </header>
    <main class="shop">
        <h1 class="shop-title">Flory Collection</h1>

        <div class="products-grid js-products-grid"></div>
    </main>


    <footer class="flory-footer">
        <div class="flory-footer-inner">
            <a class="flory-footer-brand" href="index.html" aria-label="FLORY home">
                <img src="images/flory-logo-background-removed.png" alt="FLORY">
            </a>

            <nav class="flory-footer-nav" aria-label="Footer navigation">
                <ul class="flory-footer-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#shop">Shop</a></li>
                    <li><a href="index.html#collection">Collection</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="orders.html">Orders &amp; Returns</a></li>
                </ul>
            </nav>

            <p class="flory-footer-credit">
                Developed by
                <a href="https://github.com/Elmahdi25">https://github.com/Elmahdi25</a>
            </p>
        </div>
    </footer>
     
    <script type="module" src="./script/index.js"></script>
</body>

</html>
